<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseSwap - Buscar solicitudes</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem("courseswap-theme");
            const theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body">
        <nav class="navbar navbar-expand-lg bg-body border-bottom shadow-sm">
        <div class="container py-2">
            <a class="navbar-brand fw-bold text-primary" href="./dashboard.html">CourseSwap</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#searchRequestsNavigation"
                    aria-controls="searchRequestsNavigation" aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="searchRequestsNavigation">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" href="./dashboard.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#search-requests-section">Buscar solicitudes</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-secondary btn-sm" type="button" data-theme-toggle>Modo claro</button>
                    <button class="btn btn-outline-danger btn-sm" type="button" id="logout-button">Cerrar sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="search-requests-page">
        <section id="search-requests-section" aria-labelledby="search-requests-title">
        <div class="mb-4">
            <p class="text-primary fw-semibold mb-2">Intercambios disponibles</p>
            <h1 class="h2 fw-bold" id="search-requests-title">Buscar solicitudes</h1>
            <p class="text-secondary">
                Solicitudes compatibles con las materias y grupos de tu matrícula.
            </p>
        </div>

        <div id="search-requests-alert" class="alert d-none" role="alert"></div>

        <p id="compatible-requests-count" class="small text-secondary"></p>

        <div id="empty-search-requests-state" class="alert alert-light border d-none">
            No hay solicitudes compatibles con tu matrícula por ahora.
        </div>

        <div id="compatible-requests-list"
                 class="d-flex flex-column gap-3"
                 aria-live="polite">
        </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
