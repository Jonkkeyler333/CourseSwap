<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseSwap - Buscar solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body">
    <nav class="navbar bg-body border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="./dashboard.html">CourseSwap</a>
            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-outline-primary btn-sm" href="./solicitudes.html">Mis solicitudes</a>
                <button class="btn btn-outline-secondary btn-sm" type="button" data-theme-toggle>
                    Modo claro
                </button>
                <button class="btn btn-outline-danger btn-sm" type="button" id="logout-button">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="search-requests-page">
        <div class="mb-4">
            <p class="text-primary fw-semibold mb-2">Intercambios disponibles</p>
            <h1 class="h2 fw-bold">Buscar solicitudes</h1>
            <p class="text-secondary">
                Solicitudes compatibles con las materias y grupos de tu matrícula.
            </p>
        </div>

        <div id="search-requests-alert" class="alert d-none" role="alert"></div>

        <p id="compatible-requests-count" class="small text-secondary"></p>

        <div id="empty-search-requests-state" class="alert alert-light border d-none">
            No hay solicitudes compatibles con tu matrícula por ahora.
        </div>

        <section id="compatible-requests-list"
                 class="d-flex flex-column gap-3"
                 aria-live="polite">
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
