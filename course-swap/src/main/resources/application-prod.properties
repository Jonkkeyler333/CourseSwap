server.port=${PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET_PROD}

# conexion al servidor SMTP de brevo
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAILUSER}
spring.mail.password=${MAILPASSWORD}

# 1. Autenticación y STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# 2. Confiar en el certificado y DESACTIVAR la coincidencia estricta de nombre de host
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

# 3. Forzar protocolos compatibles en Java 21
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# 4. Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000