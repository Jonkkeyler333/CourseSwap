spring.application.name=course-swap

# conexion a PostgreSQL (esta en el contenedor)
spring.datasource.url=jdbc:postgresql://localhost:5437/swap_db
spring.datasource.username=admin
spring.datasource.password=admin_en
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.security=DEBUG
# hibernate: crea/actualiza las tablas automáticamente segun los @Entity
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=NG96NXg4YXRkNG03Y3B3ZTFoOHowbTlsMjA5M3I4NzE=
jwt.expiration=3600000

# dialecto específico para PostgreSQL (opcional en versiones nuevas de Hibernate, pero explícito es mejor)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

# conexion al servidor SMTP de brevo
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAILUSER}
spring.mail.password=${MAILPASSWORD}

# 1. Autenticación y STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# 2. Confiar en el certificado y DESACTIVAR la coincidencia estricta de nombre de host
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

# 3. Forzar protocolos compatibles en Java 21
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

# 4. Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
